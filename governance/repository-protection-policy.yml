# Crossroads default GitHub repository policy.
#
# This is declarative source-of-truth configuration. GitHub does not apply this
# file automatically; the repository owner must apply the equivalent branch
# protection/ruleset settings to each repository intentionally.
version: "1.1"
scope:
  branch: main
  applies_to: every Crossroads repository unless an approved exception exists

rules:
  pull_request_required: true
  # Solo-owned repositories cannot provide independent review. Keep the PR
  # gate and CI gate; require an approval only when a second reviewer exists.
  required_approvals: 0
  # Copilot re-reviews every push; without dismissal, a single active PR
  # accumulates a dozen stale review threads that no longer match the diff.
  dismiss_stale_reviews: true
  require_last_push_approval: false
  require_conversation_resolution: true
  require_status_checks:
    strict: true
    checks:
      - "PR Validation"
  enforce_for_repository_administrators: true
  # Commits reaching a protected branch must carry verified signatures. In
  # practice main only receives merge commits created through the API, which
  # GitHub signs itself; local pushes are signed by the machine's SSH signing
  # key (registered 2026-08-23). The rule's value is that an unsigned commit
  # -- something claiming to be from this machine but not signed by it --
  # cannot land on a protected branch.
  require_signed_commits: true
  # Decision 2026-08-31, reversing 2026-08-24: the reviewer comparison ended
  # when automatic Copilot review became the fleet's dominant AI spend --
  # $78 gross of Copilot credits in August, $10.56 of it in one day once the
  # included allowance ran out, with 25 of the re-reviews landing on a single
  # iterating pull request. The Claude reviewer (_ai-review.yml) now covers
  # review-on-push from the subscription at no marginal cost, so the ruleset
  # no longer requests Copilot on push anywhere in the fleet. Copilot remains
  # available on demand per pull request. The personal-account setting for
  # automatic review was switched off the same day; this rule was the second,
  # repo-level source of the same spend.
  automatic_copilot_review: false
  allow_force_pushes: false
  allow_branch_deletion: false

exceptions:
  process: written decision record naming repository, rule, reason, owner, and expiry
  default_expiry: 90 days

decisions:
  - id: zero-approvals
    rule: required_approvals stays 0
    reason: >-
      A solo repository owner cannot approve their own pull request; any value
      above zero blocks every merge. While this holds, the AI reviewer plus the
      PR Validation gate are the only review a change receives.
    owner: tsviser
    review_by: "2026-11-23"
  - id: merge-methods
    rule: allowed_merge_methods stays [merge, squash, rebase]
    reason: >-
      Matches live fleet behaviour. Narrowing to squash-only was proposed in
      the CI roadmap and is deliberately not bundled into the control-plane
      migration; adopt it, if at all, as its own reviewed change.
    owner: tsviser
    review_by: "2026-11-23"
  - id: dismiss-stale-reviews
    rule: dismiss_stale_reviews_on_push is true on every profile
    reason: >-
      Copilot review_on_push fires on every synchronize; with dismissal off,
      one PR accumulated fourteen separate review submissions whose comments
      pointed at superseded commits. Dismissal clears outdated threads without
      blocking merge — required_approving_review_count stays 0.
    owner: tsviser
    review_by: "2026-11-23"
