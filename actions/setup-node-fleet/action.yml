name: Setup Node (fleet)
description: >-
  The fleet's standard Node setup: pinned setup-node, npm cache, `npm ci`.
  One place to bump the Node major or the action SHA for every consumer.

inputs:
  node-version:
    description: Node major to install.
    required: false
    default: "24"
  working-directory:
    description: Directory holding package.json and package-lock.json.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
