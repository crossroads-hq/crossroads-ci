name: Crossroads gate
description: >-
  The fleet's aggregate "PR Validation" gate logic. The calling job keeps the
  name -- GitHub stores a required status check as plain text, and a job that
  merely CALLS a reusable workflow reports as "caller / callee", which would
  silently break every protection rule in the fleet. A composite action leaves
  the caller's check context untouched; only the logic lives here.

  The caller stays responsible for two things this action cannot reach: the
  job-level "if: not cancelled()" guard (a run superseded by a new push should
  render no verdict at all, not a red check), and the `needs:` list.

  NOTE: doc strings in this file deliberately avoid literal expression syntax
  -- GitHub evaluates expressions inside action metadata, so a documentation
  example written verbatim stops the action loading at all.

inputs:
  results:
    description: >-
      JSON object mapping a human-readable job name to its needs.<job>.result
      value, e.g. '{"Verification": "<verify result>"}' with the value filled
      by an expression in the caller. Every entry must be `success` to pass,
      unless listed in allow-skipped.
    required: true
  allow-skipped:
    description: >-
      Names from `results` for which `skipped` also passes, one per line.
      For jobs with their own legitimate skip conditions -- an AI review that
      sits out docs-only diffs, a path-filtered verify leg, a publish-check
      that only runs on main. A skip only ever excuses a job that chose not to
      run; `cancelled` and `failure` never pass.

      CAUTION: a job also skips when something it `needs` fails. So whenever
      you excuse a path-filtered job here, the job computing that filter must
      appear in `results` and must NOT be excused -- otherwise its failure
      skips every leg it feeds, each skip is excused, and the gate passes
      having checked nothing. This repository's own gate shipped that hole.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Two OS-gated invocations of the same file, because the fleet's runners
    # do not share a shell: the Windows backup has no bash (its first routed
    # gate died on `bash: command not found`), and macOS has no powershell.
    # The logic lives once, in check.js; node is the only real dependency.
    - name: Check required results (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
      run: node "${{ github.action_path }}/check.js"

    - name: Check required results (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      env:
        RESULTS: ${{ inputs.results }}
        ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
      run: |
        node "${{ github.action_path }}/check.js"
        exit $LASTEXITCODE
