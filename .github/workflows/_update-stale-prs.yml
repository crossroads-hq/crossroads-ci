# Reusable: keep a repository's auto-merge pull requests current with its base.
#
# The rulesets require a branch to be up to date with its base, so each merge
# strands every other open PR until someone clicks "Update branch", and
# auto-merge cannot get past that. This does the click, for PRs that have
# auto-merge enabled. scripts/update-stale-prs.sh has the selection rules;
# README, "Stale PR updates", has the setup, including the GitHub App.
#
# Callable from any fleet repository. The caller fires it on push to its base
# branch:
#
#   on: { push: { branches: [main] }, workflow_dispatch: }
#   jobs:
#     update:
#       uses: crossroads-hq/crossroads-ci/.github/workflows/_update-stale-prs.yml@<sha>
#       secrets: inherit
#
# The App's credentials belong in an ENVIRONMENT of the calling repository, not
# in repository or organisation secrets. The job below declares the environment
# (default `pr-updater`); give that environment a deployment-branch policy of
# `main` only and keep PR_UPDATER_APP_CLIENT_ID and PR_UPDATER_APP_PRIVATE_KEY
# there. A repository or organisation secret is readable by a workflow run from
# ANY branch of that repository, so anyone or anything that can push a branch
# could read the key, which can mint tokens for every installation of the App.
# An environment secret is refused to every ref the policy does not allow, and
# a job that does not name the environment sees nothing. `secrets: inherit` is
# required: a called workflow receives environment secrets only through it, and
# the calling job cannot name an environment itself. (Tested 2026-10-12 against
# a throwaway repository: the main run saw the secret, a branch job naming the
# environment was refused before running any step, and a branch job not naming
# it saw an empty value.)
#
# The explicit `secrets:` mapping below still works for callers not yet
# migrated, and the environment's secrets win when both exist. It leaves the
# key readable from any branch, so migrate: see README, "Stale PR updates".
#
#       secrets:
#         app-client-id: ${{ secrets.PR_UPDATER_APP_CLIENT_ID }}
#         app-private-key: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY }}
#
# This repository runs update-stale-prs.yml instead, which calls the script
# from its own checkout so it is always current. Keep the token permissions in
# the two in step.
name: Update stale PRs

on:
  workflow_call:
    inputs:
      base-branch:
        description: >-
          Branch whose pull requests are kept current. The job runs only when
          the caller was triggered for this branch, so a manual run from some
          other branch cannot use the write token.
        type: string
        required: false
        default: main
      environment:
        description: >-
          Environment of the calling repository that holds
          PR_UPDATER_APP_CLIENT_ID and PR_UPDATER_APP_PRIVATE_KEY. Give it a
          deployment-branch policy of `main` only. If it does not exist,
          GitHub creates it empty on first use, with no policy and no secrets.
        type: string
        required: false
        default: pr-updater
      max-updates:
        description: >-
          Keep at most this many auto-merge pull requests current at once,
          oldest auto-merge first, passing over any whose checks have failed.
          Empty (the default) keeps every one of them current, as before. A
          positive integer; anything else fails the run. README, "Limiting how
          many PRs are kept current".
        type: string
        required: false
        default: ""
    secrets:
      # Declared so the called workflow can read them, and optional because
      # they arrive from the caller's ENVIRONMENT through `secrets: inherit`
      # (the caller never names them). Tested 2026-10-12: declared, they still
      # reach the main run and are still refused to a branch run.
      PR_UPDATER_APP_CLIENT_ID:
        description: Client ID of the PR-updater GitHub App, from the environment.
        required: false
      PR_UPDATER_APP_PRIVATE_KEY:
        description: A private key of that App, the whole .pem, from the environment.
        required: false
      app-client-id:
        description: >-
          Legacy. Client ID of the PR-updater GitHub App, passed explicitly.
          Prefer `secrets: inherit` and the environment's own secrets.
        required: false
      app-private-key:
        description: >-
          Legacy. A private key generated on that App, the whole .pem. Passing
          it leaves it readable from any branch of the caller.
        required: false

permissions:
  contents: read

jobs:
  update:
    name: Update stale PRs
    # github.ref is the CALLER's ref in a reusable workflow.
    if: github.ref == format('refs/heads/{0}', inputs.base-branch)
    # GitHub-hosted only, with no input to change it. This job receives the
    # crossroads-ci-pr-updater App's private key, which can mint Contents, Pull
    # requests and Workflows write tokens for every repository the App is
    # installed on, so it must never run on the shared, persistent self-hosted
    # fleet where pull-request code also runs (owner decision, 2026-10-12;
    # hq#114). A private caller pays about one hosted minute per merge. Hosted
    # also starts when the fleet is down, when a silent updater would go
    # unnoticed. The image provides gh and jq.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Where the App's credentials live. With a deployment-branch policy of
    # `main`, this job is refused on any other ref before it runs a step.
    environment: ${{ inputs.environment }}
    # One run per repository at a time, queued rather than cancelled: a run
    # cancelled mid-loop would leave PRs behind until the next merge.
    concurrency:
      group: update-stale-prs-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check the App credentials are configured
        env:
          # Presence only; the values never reach this step.
          CLIENT_ID_SET: ${{ secrets.PR_UPDATER_APP_CLIENT_ID != '' || secrets.app-client-id != '' }}
          KEY_SET: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY != '' || secrets.app-private-key != '' }}
        run: |
          missing=""
          [ "$CLIENT_ID_SET" = "true" ] || missing="$missing app-client-id"
          [ "$KEY_SET" = "true" ] || missing="$missing app-private-key"
          if [ -n "$missing" ]; then
            echo "::error::Missing credential(s) for the updater:${missing}. Put PR_UPDATER_APP_CLIENT_ID and PR_UPDATER_APP_PRIVATE_KEY in the caller's environment and call with secrets: inherit. GITHUB_TOKEN cannot stand in: its pushes start no workflows, so updated PRs would never re-run PR Validation. See crossroads-ci README, \"Stale PR updates\"."
            exit 1
          fi

      # Scoped to the CALLING repository only, and to the three permissions
      # update-branch needs; Workflows because the merge it creates carries
      # whatever the base changed under .github/workflows. The token is revoked
      # when the job ends. The App must be installed on the caller.
      - name: Mint a token for the update
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PR_UPDATER_APP_CLIENT_ID || secrets.app-client-id }}
          private-key: ${{ secrets.PR_UPDATER_APP_PRIVATE_KEY || secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # The script travels in this repository's action, pinned by SHA: the
      # caller's token cannot read this private repository, so it cannot
      # check it out. Nothing from the caller is executed. After changing
      # scripts/update-stale-prs.sh, bump this pin to a commit on main.
      - name: Update PRs that are behind
        uses: crossroads-hq/crossroads-ci/actions/update-stale-prs@1ee4c13d7fa329c970ee651b41c5dfe113d056ef # crossroads-ci#107, adds max-updates
        with:
          token: ${{ steps.token.outputs.token }}
          repo: ${{ github.repository }}
          base: ${{ inputs.base-branch }}
          max-updates: ${{ inputs.max-updates }}
