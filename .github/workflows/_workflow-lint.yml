# Reusable: lint the CALLER's workflow files with actionlint and zizmor.
#
# Callable because its check name is not load-bearing anywhere -- reusable
# workflows report as "caller / callee", which is fine for any job that is not
# itself the required "PR Validation" context. The gate logic, whose name IS
# load-bearing, lives in actions/gate instead.
#
# One job, one checkout: actionlint and zizmor are fast and share the same
# tree; splitting them doubled runner startup for no wall-clock win.
name: Workflow lint

on:
  workflow_call:
    inputs:
      runner-labels:
        description: >-
          JSON array of `runs-on` labels, e.g.
          `["self-hosted","Linux","X64","light"]`. A JSON string rather than a
          plain label because `runs-on` needs a LIST for a self-hosted target
          and Actions gives an input no list type.

          Defaults to GitHub-hosted, which public callers keep: a public
          repository's pull requests must never run on the persistent
          self-hosted fleet. PRIVATE callers should pass self-hosted labels,
          because a hosted job on a private repository spends paid Actions
          minutes, each job rounded up to a whole minute.

          The target must be Linux on x86-64: all three tools are fetched as
          pinned `linux` x86-64 binaries and verified with `sha256sum`. Name
          `Linux` and `X64` in the labels, since `fast` and `light` alone also
          match the macOS runners. Docker and pipx are NOT required.
        type: string
        required: false
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  lint:
    name: Workflow lint
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned release binaries, verified by checksum, rather than the
      # actionlint Docker image and `pipx run`: the self-hosted fleet has
      # neither a Docker daemon nor pipx. shellcheck is fetched too because
      # actionlint checks `run:` scripts with whatever shellcheck is on PATH,
      # and silently skips that check when there is none -- the Docker image
      # bundled it, so dropping it would weaken the lint without a sound.
      # Checksums are the publishers' own: actionlint's checksums.txt, and
      # GitHub's release-asset digest for shellcheck and zizmor.
      - name: Install actionlint, shellcheck and zizmor
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          ZIZMOR_VERSION: 1.11.0
          ZIZMOR_SHA256: da35e666827cbb1e6ca98b18b7969657b9f186467bfebfa25e730aac527c36f8
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/workflow-lint-bin"
          mkdir -p "$bin"
          cd "${RUNNER_TEMP}"
          curl -sSfL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o shellcheck.tar.gz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -sSfL --retry 3 -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum -c - <<SUMS
          ${ACTIONLINT_SHA256}  actionlint.tar.gz
          ${SHELLCHECK_SHA256}  shellcheck.tar.gz
          ${ZIZMOR_SHA256}  zizmor.tar.gz
          SUMS
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          tar -xzf shellcheck.tar.gz -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          tar -xzf zizmor.tar.gz -C "$bin" ./zizmor
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--persona=regular` and non-zero only on findings at `high` and
        # above: the fleet's self-hosted-runner jobs trip zizmor's
        # lower-severity audits by design (documented in each workflow), and a
        # linter that cries wolf gets removed. Tighten this once the
        # self-hosted runners are hardened so those audits no longer fire by
        # design. (The phased fleet CI plan that called this "Phase 04" was
        # never committed; see README "Open decisions".)
        run: |
          zizmor --min-severity=high .github/workflows/
