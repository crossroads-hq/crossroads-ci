# Reusable: the fleet's supply-chain checks for a pull request.
#
# Three jobs, one workflow:
#   - dependency review: known-vulnerable or newly-introduced dependencies in
#     the PR diff (uses the dependency graph; enable it per repository).
#   - lockfile checks: OSV scan and optional npm audit share one shallow
#     checkout; keep them separate from gitleaks, which needs full history.
#   - gitleaks: credentials in the diff and history.
#
# Free on public and private repositories alike -- none of this requires a
# GitHub Advanced Security licence. Callers add one job:
#
#   supply-chain:
#     uses: crossroads-hq/crossroads-ci/.github/workflows/_supply-chain.yml@v1
#     with: { npm-audit: true }
name: Supply chain

on:
  workflow_call:
    inputs:
      npm-audit:
        description: Run `npm audit` against the lockfile.
        type: boolean
        required: false
        default: false
      dependency-review:
        description: >-
          Diff-level dependency review. On PRIVATE repositories this API
          requires a GitHub Advanced Security licence -- the action fails
          with "Dependency review is not supported on this repository" --
          so private callers turn it off. Free and on by default for public
          repositories.
        type: boolean
        required: false
        default: true
      osv-scan:
        description: >-
          Scan lockfiles against the OSV database. Off for a repository with
          no lockfiles (the scanner errors on an empty scan set) or one whose
          KNOWN advisories are tracked toward a fix -- an always-red check
          teaches people to ignore the gate.
        type: boolean
        required: false
        default: true
      runner-labels:
        description: >-
          JSON array of `runs-on` labels for all three jobs, e.g.
          `["self-hosted","fast"]`. A JSON string rather than a plain label
          because `runs-on` needs a LIST for a self-hosted target and Actions
          gives an input no list type.

          Defaults to GitHub-hosted, so every existing caller is unchanged.
          Worth moving for cost: these jobs are seconds long, but Actions
          bills each JOB rounded up to a whole minute, so two ~15-second
          jobs cost two minutes on every run of every private caller.

          ONLY point this at self-hosted infrastructure from a repository
          that does not accept fork pull requests. Unlike _ai-review.yml,
          which gates its job on `head.repo.full_name == github.repository`,
          none of these three has a same-repo guard -- `gitleaks` has no
          `if:` at all -- so a fork PR schedules work on whatever runner
          this input names: a full-history checkout, a binary download, and
          a container-based scanner, all over a branch a stranger wrote. On
          a GitHub-hosted runner that is a throwaway VM; on a persistent
          self-hosted one it is the exposure GitHub's own documentation
          warns about. The guard is deliberately NOT added here -- it would
          stop fork PRs being scanned at all, and scanning them is the
          point -- which is exactly why the constraint lands on this input
          instead.

          Two further requirements on the target, neither checked here:
          Linux (the gitleaks step fetches a `linux_x64` tarball and shells
          out to `sha256sum`), and a working Docker daemon when `osv-scan`
          is on, because osv-scanner-action is a container action. A runner
          missing Docker fails the lockfile job rather than skipping it --
          verify before moving a caller that sets `osv-scan: true`.
        type: string
        required: false
        default: '["ubuntu-latest"]'
      working-directory:
        description: Directory holding package.json, for npm-audit.
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lockfile-checks:
    name: Lockfile checks
    if: inputs.osv-scan || inputs.npm-audit
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The osv-scanner BINARY, not osv-scanner-action. The action is a
      # CONTAINER action, so it needs a docker daemon on the runner -- which
      # GitHub-hosted runners have and the fleet does not (measured
      # 2026-09-05 on wsl-fleet-3: docker MISSING, daemon NOT REACHABLE).
      # That single dependency was the only thing keeping these jobs on paid
      # runners, so it is cheaper to drop it than to install docker on every
      # runner the fleet will ever have.
      #
      # Same treatment as gitleaks below, for the same reason and in the same
      # shape: executable input gets pinned by version AND release checksum.
      # A raw binary here, not a tarball -- osv-scanner publishes bare
      # per-platform executables and one SHA256SUMS file.
      #
      # linux_amd64 matches every runner in play (hosted ubuntu-latest and the
      # X64 fleet); an arm64 runner would need a second case here, exactly as
      # gitleaks' linux_x64 would.
      #
      # Exit codes, measured against v2.5.1 rather than assumed:
      #   0   scan completed, nothing found
      #   1   vulnerabilities found -- the failure this job exists to raise
      #   128 no package sources found
      # 128 stays fatal, which is what the action did: it is the "empty scan
      # set" case the `osv-scan` input already tells such callers to turn off.
      # It is named explicitly because a bare 128 is precisely the kind of
      # opaque CI failure that costs an hour to diagnose.
      - name: Scan lockfiles against OSV
        if: inputs.osv-scan
        env:
          OSV_VERSION: 2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/osv-scanner"

          set +e
          "${RUNNER_TEMP}/osv-scanner" scan source --recursive .
          osv_status=$?
          set -e

          case "$osv_status" in
            0) ;;
            1)
              echo "osv-scanner found known vulnerabilities in a lockfile (listed above)." >&2
              exit 1
              ;;
            128)
              echo "osv-scanner found no package sources to scan under '.'." >&2
              echo "A repository with no lockfiles should set \`osv-scan: false\` rather" >&2
              echo "than fail this job on every pull request." >&2
              exit 1
              ;;
            *)
              echo "osv-scanner exited ${osv_status}, which is neither a clean scan," >&2
              echo "a finding, nor an empty scan set. Treating as a failure." >&2
              exit 1
              ;;
          esac

      - name: Audit lockfile
        if: inputs.npm-audit
        working-directory: ${{ inputs.working-directory }}
        run: npm audit --audit-level=high

  gitleaks:
    name: Secret scan
    # `pull-requests: read` is gone with the action wrapper below: it was
    # granted so the wrapper could list the PR's commits to bound its scan
    # range, and the direct scan reads only the checkout.
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed then reverted is still leaked.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks BINARY, not gitleaks/gitleaks-action. The wrapper demands
      # a license key the moment the repository owner is an organization
      # ("[crossroads-hq] is an organization. License key is required." --
      # measured on the first PR after the crossroads-hq transfer), which
      # would fail this job, and with it the gate, on every PR in the fleet.
      # The scanner itself is MIT-licensed; only the wrapper gates. The
      # tarball is executable input, so it gets the same treatment as an
      # action SHA: pinned by version AND release checksum.
      #
      # `gitleaks git` walks the full history fetched above -- the same "a
      # secret committed then reverted is still leaked" coverage as before;
      # the wrapper's PR-range bounding was an optimisation, not a scope.
      # --redact keeps a real find out of a public log, and -v prints each
      # finding (rule, file, commit, fingerprint) WITH the secret redacted --
      # without it gitleaks reports only a count, and the first real failure
      # (crossroads-ui, a public-by-design PostHog key) had to be reproduced
      # locally just to learn what was flagged. Exit code 1 on leaks
      # fails the job exactly as the wrapper did.
      - name: Scan for leaked credentials
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          (cd "${RUNNER_TEMP}" \
            && echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c - \
            && tar -xzf gitleaks.tar.gz gitleaks)
          "${RUNNER_TEMP}/gitleaks" git --redact -v --no-banner --exit-code 1 .
