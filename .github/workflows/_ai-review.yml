# Reusable: Codex-first AI review for a pull request, deduplicated by head SHA.
# Codex automatic review is triggered by the GitHub integration. This workflow
# waits for its current-head verdict, then runs Claude Sonnet only when no
# verified Codex review result arrives within the bounded wait or its state is
# unknown.
#
# Supersedes the _ai-review.yml retired 2026-08-24. That retirement recorded
# "zero reviews produced across the comparison window"; the cause, in the same
# commit message, was that "every candidate PR tripped the action's
# anti-tampering guard or was documentation-only". Checked against the API:
# no Claude review was ever posted on crossroads-ui, across 100 pull requests.
# The reviewer was never handed a diff. That is not a verdict on the reviewer.
#
# The old guard skipped any PR touching .github/workflows/. In a fleet whose
# main working repository is a CI control plane, that is most pull requests --
# and it skipped review of exactly the changes that most warrant one. The same
# inversion `actions/detect-reviewable` was written to fix, reintroduced one
# workflow later.
#
# The concern behind it was real. On a `pull_request` event for a same-repo
# branch, the workflow definition comes from the PR's merge ref, so a pull
# request can edit CI and have its edit run with secrets. Two surfaces:
#
#   1. This workflow's own logic. Solved by living here: a consumer's pull
#      request cannot alter a reusable workflow pinned to a SHA in this
#      repository.
#   2. The review contract, which lives in the CONSUMER repository and is
#      checked out from the PR head. This one was never addressed -- the guard
#      dodged it by not reviewing at all.
#
# So the contract is read from the BASE ref instead. A pull request that
# rewrites the rules is reviewed under the rules as they stand on the base
# branch, and the rewrite is called out to the reviewer as a change to judge.
# Review coverage and tamper-resistance stop being a trade.
#
# NOT a required check by design: a reviewer that can block a merge is a
# reviewer that gets worked around. The gate should not list this job.
name: AI review

on:
  workflow_call:
    inputs:
      guidelines-file:
        description: >-
          Repo-relative path to the review contract. Read from the base ref,
          never from the pull request. Optional -- without it the reviewer
          falls back to a general-purpose brief, so a repository with no
          contract still gets reviewed.
        type: string
        required: false
        default: .github/review-guidelines.md
      max-turns:
        description: >-
          Claude Code turn budget for one review. Measured: a one-file script
          diff took 14 turns; 25 was exhausted mid-review by a moderate
          multi-file PR (crossroads-ui#181, subtype error_max_turns); 60 was
          exhausted the same way by a 45-file PR (crossroads-ui#210), which
          burned the budget in 9m35s of a 45-minute job. Both times the budget
          bound before the timeout did, and both times the reviewer had already
          posted real findings — the run failed AFTER the thorough path worked,
          reporting a reviewed PR as unreviewed. The budget bounds a runaway,
          not a diligent review, so it sits well above the largest measured
          need; the job timeout (`job-timeout-minutes`) is the hard stop. At the observed
          ~6 turns per minute, 120 lands near 20 minutes and leaves the timeout
          as the real bound, which is where the ceiling belongs.
        type: number
        required: false
        default: 120
      codex-wait-seconds:
        description: >-
          How long to wait for a verified Codex review result on the current
          head before running Claude as the fallback reviewer. Zero checks once
          without waiting. This is a delivery timeout, not a claim that Codex
          tokens were exhausted; GitHub exposes no such verified signal. Must
          be between 0 and 600, which keeps the review step's own
          `review-timeout-minutes` bound clear of the job timeout even at the
          longest wait. The pre-flight budget check enforces that rather than
          leaving it to these two descriptions agreeing.
        type: number
        required: false
        # PR #20 measured a Codex review arriving about 190 seconds after the
        # wait began, just beyond the former 180-second default.
        default: 300
      job-timeout-minutes:
        description: >-
          Ceiling for the whole job. Exposed as an input only so the pre-flight
          budget check can read the same number the job is bounded by: Actions
          gives a step no way to read its own job's `timeout-minutes`, so the
          alternative is a second literal that drifts. Lowered without the
          guard following, the guard would wave through budgets the job then
          cancels -- which skips the step that reports why, the failure this
          workflow is built to prevent.
        type: number
        required: false
        default: 45
      review-timeout-minutes:
        description: >-
          Wall-clock bound on the review step itself, in minutes. Separate from
          the job's own `timeout-minutes` on purpose: a job timeout CANCELS the
          job, which skips the step that reports why, so the run dies with no
          explanation. A step timeout fails only that step and leaves the
          reporting intact. Keep it above the turn budget's expected wall-clock
          cost, so `max-turns` stays the ordinary bound, and far enough below
          the job timeout that this fires first.
        type: number
        required: false
        default: 30
    secrets:
      claude-code-oauth-token:
        description: The caller's CLAUDE_CODE_OAUTH_TOKEN.
        required: true

permissions:
  contents: read

jobs:
  review:
    name: AI review
    # The caller gates on its own conditions (draft, labels, site-only); this
    # workflow enforces the ones it can see. The fork check is load-bearing:
    # secrets must never reach a workflow definition a stranger controls.
    # The dependabot exclusion is structural, not preference: its runs draw
    # from the Dependabot secrets store (no reviewer token there), and its
    # actions-group PRs edit workflow files, which the review action's
    # anti-tamper guard refuses to run against. Both were measured on PR #20
    # -- the job can only fail, so it must not start.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[skip-ai-review]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # Dedup reads /actions/runs and /actions/runs/{id}/jobs. It used to read
      # /commits/{sha}/check-runs, which needed `checks: read`; moving to the
      # Actions API to scope dedup to the caller's own workflow file changed
      # the scope with it, and the grant did not follow. Job-level permissions
      # are a whitelist -- anything unlisted is `none`, never inherited -- so
      # the mismatch would 403 and take the job with it.
      actions: read
      # The action exchanges the workflow's OIDC token for a Claude App token
      # so comments are attributed to claude[bot]. Safe under the fork guard.
      id-token: write
    runs-on: ubuntu-latest
    # Read by the budget guard below through the same input, so the two cannot
    # disagree.
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    # PR-keyed and cancelling, not SHA-keyed and serialising. Any dedup that
    # reads shared state helps only AFTER a run finishes writing it; two runs
    # in flight for one SHA both see "not reviewed" and both pay. Keying on the
    # pull request and cancelling means a superseded push drops the run it
    # superseded instead of queueing behind it -- which is the cost bound this
    # workflow claims. A cancelled review is not a lost one: the SHA is never
    # recorded, so the surviving run reviews the state that matters.
    concurrency:
      group: crossroads-ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # First, and pure arithmetic, so a misconfigured budget is refused before
      # anything is spent. `codex-wait-seconds` is bounded in check.js
      # (WAIT_SECONDS must not exceed 600); `review-timeout-minutes` had no
      # equivalent, and the margin this job depends on only holds while both
      # stay small enough to fit under the job's own timeout.
      #
      # Getting this wrong is silent and expensive: the job timeout fires
      # instead of the step timeout, `cancelled()` becomes true, the step that
      # explains why is skipped, and the run dies red with an empty summary --
      # exactly what moving the bound onto the step was meant to prevent. Both
      # tunables have already been raised more than once, so the guard is
      # against the ordinary case rather than a hypothetical one.
      - name: Check the review budget fits the job timeout
        env:
          REVIEW_TIMEOUT: ${{ inputs.review-timeout-minutes }}
          CODEX_WAIT: ${{ inputs.codex-wait-seconds }}
          # The job's own ceiling, through the input it is set from -- not a
          # second literal. A guard that measures against a stale copy of the
          # bound is the drift this workflow keeps removing elsewhere.
          JOB_TIMEOUT: ${{ inputs.job-timeout-minutes }}
          # Measured at ~12s total (change detection, dedup, checkout at
          # fetch-depth 0, contract resolution, confirmation, reporting); 2
          # minutes is that with an order of magnitude to spare.
          OVERHEAD_MARGIN: 2
        run: |
          set -euo pipefail
          codex_minutes=$(( (CODEX_WAIT + 59) / 60 ))
          needed=$(( codex_minutes + REVIEW_TIMEOUT + OVERHEAD_MARGIN ))
          if [ "$needed" -gt "$JOB_TIMEOUT" ]; then
            {
              echo "### Review budget does not fit the job timeout"
              echo
              echo "\`codex-wait-seconds\` (${CODEX_WAIT}s = ${codex_minutes}m) plus"
              echo "\`review-timeout-minutes\` (${REVIEW_TIMEOUT}m) plus ${OVERHEAD_MARGIN}m of"
              echo "measured overhead needs ${needed}m, but the job timeout is ${JOB_TIMEOUT}m."
              echo
              echo "The job would be cancelled before the review step's own timeout"
              echo "fires, which skips the step that reports why. Lower one of the two"
              echo "inputs, or raise the job timeout deliberately."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Review budget needs ${needed}m but the job timeout is ${JOB_TIMEOUT}m; refusing to start." >&2
            exit 1
          fi
          echo "Review budget fits: ${codex_minutes}m Codex wait + ${REVIEW_TIMEOUT}m review + ${OVERHEAD_MARGIN}m overhead = ${needed}m of ${JOB_TIMEOUT}m." >> "$GITHUB_STEP_SUMMARY"

      - name: Detect reviewable changes
        id: changes
        # The REMOTE pin, not `./actions/...`: in a reusable workflow consumed
        # cross-repo, a relative path resolves against the CALLER's checkout,
        # which at this point in the job does not exist.
        uses: crossroads-hq/crossroads-ci/actions/detect-reviewable@932432038147d4f19d5c996e9985d8dcc87bf4f6 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One review per head SHA. The marker comment survives pushes, so a
      # `synchronize` for a new commit reviews it, while re-deliveries of an
      # already-reviewed state (reopen, ready_for_review after no change) skip
      # the model entirely. This is what keeps "review on push" from meaning
      # "review the same diff five times".
      # Dedup off THIS JOB'S OWN completed runs, not off a comment.
      #
      # A marker comment is mintable by anything holding GITHUB_TOKEN --
      # Dependabot, Copilot, or a one-shot job added by the very pull request
      # under review, which on a `pull_request` event runs from the merge ref.
      # Such a job can post the marker for its own head SHA before this step
      # lists comments; dedup then skips, the job goes green, and Claude never
      # runs. That is the tamper class this rebuild exists to close, so
      # narrowing WHO may write the marker was never going to finish -- four
      # rounds of review narrowed it from any commenter, to any bot, to one
      # login, and it stayed mintable at every step.
      #
      # A check run is minted by Actions for a job that actually executed.
      # Nothing holding a token can forge one. But this job now has two green
      # paths: a confirmed Claude delivery, or verified current-head Codex
      # evidence that was present when the job ran. Formal Codex reviews can
      # later be dismissed, so a green job alone cannot safely dedup that path.
      # Only the named Claude confirmation step is durable enough to skip
      # directly; Codex-only successes flow to the verifier below and are
      # revalidated against the current formal-review or clean-comment state.
      # The reviewer ACTION refuses to run when the workflow that invoked it
      # differs from the copy on the default branch -- it exits as a SKIP,
      # having posted nothing, so from outside it is indistinguishable from a
      # reviewer that ran and stayed silent. Measured on crossroads-ui#227,
      # whose only changed file is the caller workflow: "Workflow validation
      # failed... Skipping action due to workflow validation", review step
      # duration 1.9s against the 8-12 minutes a real review takes.
      #
      # This does NOT skip the review. The guard that skipped every pull
      # request touching .github/workflows/ is the inversion this workflow was
      # written to remove, per the header above, and reinstating it here under
      # a new name would be the same mistake. The reviewer is still invoked and
      # the job still fails; what changes is that the failure names this cause
      # instead of sending the reader to check the action's tool configuration.
      - name: Detect whether this pull request edits the invoking workflow
        id: entry
        if: steps.changes.outputs.reviewable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Same parse as the dedup step below: workflow_ref is
          # owner/repo/.github/workflows/x.yml@ref.
          wf_path="${WORKFLOW_REF%%@*}"
          wf_path="${wf_path#*/}"
          wf_path="${wf_path#*/}"

          if gh api "repos/${REPO}/pulls/${PR}/files" --paginate --slurp \
              | jq -e --arg p "$wf_path" 'any(.[][]; .filename == $p)' >/dev/null; then
            echo "edits-invoking-workflow=true" >> "$GITHUB_OUTPUT"
            echo "This pull request edits ${wf_path}, the workflow that invokes the reviewer, so the reviewer action will refuse to run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "edits-invoking-workflow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether Claude already reviewed this head SHA
        id: dedup
        if: steps.changes.outputs.reviewable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Scoped to the CALLER'S OWN WORKFLOW FILE, not to any check run that
          # happens to carry this job's name. A check run records no workflow
          # path -- measured: name and app only -- so matching on the name
          # alone accepted a job called "AI review" anywhere in the
          # repository, including one a pull request adds in a workflow of its
          # own. It could succeed in seconds and the real review would skip:
          # the same tamper class as the comment marker this replaced, one
          # layer further in.
          #
          # A workflow RUN does carry `.path`. Filtering this head SHA's runs
          # to the caller's own workflow file, then reading that run's jobs,
          # leaves one way to forge a match -- edit the caller workflow itself
          # -- which is the residual already documented in the README, not a
          # separate hole.
          #
          # The current run is in this list; its own job is in_progress with a
          # null conclusion and cannot match.
          wf_path="${WORKFLOW_REF%%@*}"   # owner/repo/.github/workflows/x.yml
          wf_path="${wf_path#*/}"         # repo/.github/workflows/x.yml
          wf_path="${wf_path#*/}"         # .github/workflows/x.yml

          prior_claude=0
          for rid in $(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --paginate --slurp \
              | jq -r --arg p "$wf_path" '.[].workflow_runs[] | select(.path == $p) | .id'); do
            n="$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" --paginate --slurp \
              | jq '[.[].jobs[]
                       | select((.name | endswith("AI review")) and .conclusion == "success")
                       | select(any(.steps[]?;
                           .name == "Confirm a review actually reached the pull request" and
                           .conclusion == "success"))]
                    | length')"
            prior_claude=$((prior_claude + n))
          done

          if [ "${prior_claude:-0}" -gt 0 ]; then
            echo "Head ${HEAD_SHA} already has a confirmed Claude review; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Codex review
        id: codex
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false'
        uses: crossroads-hq/crossroads-ci/actions/await-codex-review@c863c4b2c0e3614b50986277a22b962bc98402ee # await-codex-review v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-seconds: ${{ inputs.codex-wait-seconds }}

      - name: Checkout
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' && steps.codex.outputs.reviewed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR HEAD, not the default merge ref. Dedup is keyed on
          # head.sha, and the merge ref's content changes when the BASE moves
          # while head.sha stays put -- so the default would review one tree
          # and record a different one as reviewed, and a base change would
          # never be re-reviewed. Reviewing head keeps the two describing the
          # same thing; the fleet's rulesets set
          # strict_required_status_checks_policy, so a branch is current with
          # base by the time it can merge anyway.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The contract, resolved from the base branch and written OUTSIDE the
      # working tree. Outside matters: dropping it into the checkout would put
      # it in the diff the reviewer is judging.
      - name: Resolve the review contract from the base ref
        id: contract
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' && steps.codex.outputs.reviewed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GUIDELINES: ${{ inputs.guidelines-file }}
        run: |
          set -euo pipefail

          # Normalise once. `guidelines-file` is documented repo-relative, but
          # a caller may reasonably write `./.github/review-guidelines.md`.
          # That breaks BOTH uses below in ways that fail quietly: the contents
          # API does not resolve `./path`, and the pull request file list
          # carries no `./`, so the contract_changed grep would miss a PR that
          # edits the contract -- the reviewer would then not be told the rules
          # it is applying are the very thing under change.
          while :; do
            case "$GUIDELINES" in
              ./*) GUIDELINES="${GUIDELINES#./}" ;;
              /*)  GUIDELINES="${GUIDELINES#/}" ;;
              *)   break ;;
            esac
          done

          # Validate before it reaches a URL. `guidelines-file` is caller
          # controlled, and on a pull_request the caller workflow comes from
          # the merge ref -- so the pull request under review can set it. It is
          # then interpolated into `contents/${GUIDELINES}?ref=${BASE_REF}`,
          # where a `?` starts a query of the attacker's choosing and the FIRST
          # ref wins. Measured against this repository:
          #
          #   guidelines-file: 'README.md?ref=feat/claude-review&x='
          #   -> contents/README.md?ref=feat/claude-review&x=?ref=main
          #   -> returns the BRANCH's blob, not main's
          #
          # That reads the contract from the pull request's own head: the
          # reviewer would apply rules the diff supplied, which is precisely
          # the tamper this workflow was rebuilt to prevent, reintroduced
          # through its own configuration. A `#` truncates, and `..` walks the
          # path. So: a positive charset, and no dot-dot segments.
          case "$GUIDELINES" in
            ''|..|../*|*/../*|*/..)
              echo "guidelines-file '${GUIDELINES}' contains a '..' segment; refusing." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$GUIDELINES" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "guidelines-file '${GUIDELINES}' is not a plain repo-relative path." >&2
            echo "Allowed: letters, digits, dot, underscore, hyphen, slash. This input" >&2
            echo "is interpolated into an API path, so anything else is refused." >&2
            exit 1
          fi

          dest="${RUNNER_TEMP}/review-guidelines.md"

          # Read from the API, not from local git refs: the checkout pins `ref`
          # to the head SHA and a SHA checkout does not guarantee
          # refs/remotes/origin/* is populated. `?ref=<base>` enforces the same
          # "from the base branch, never from this pull request" guarantee
          # without depending on what checkout left on disk, and it
          # authenticates, so it works on private consumers.
          # BASE_REF is percent-encoded before it goes into a PATH segment.
          # Not because a slash cannot be resolved -- `commits/feat/my-branch`
          # resolves fine -- but because /commits/{ref} has real sub-routes,
          # and a branch whose name ends in one silently reaches a different
          # endpoint. Measured against this repository:
          #
          #   commits/main/comments    -> the comments sub-route, an ARRAY, so
          #                               `.sha` errors and a branch that
          #                               EXISTS is reported unresolvable
          #   commits/main/check-runs  -> the check-runs sub-route, no .sha
          #   commits/main/status      -> the status sub-route, which DOES
          #                               carry a .sha, so the probe passes
          #                               while having asked a different
          #                               question entirely
          #
          # Encoded, all three correctly report "no such ref", and a real
          # slash branch still resolves. The query parameter below needs no
          # such treatment -- it is not a path segment.
          BASE_REF_PATH="$(jq -rn --arg s "$BASE_REF" '$s|@uri')"
          if ! gh api "repos/${REPO}/commits/${BASE_REF_PATH}" --jq '.sha' >/dev/null 2>&1; then
            echo "Cannot resolve base ref '${BASE_REF}'; refusing to review without" >&2
            echo "establishing whether a contract exists on the base branch." >&2
            exit 1
          fi

          # Exactly one of these becomes true, and every path that is not a
          # real usable contract must still reach the contract_changed
          # detection at the end -- so no branch here exits early on success.
          have_contract=false
          err="$(mktemp)"

          if meta="$(gh api "repos/${REPO}/contents/${GUIDELINES}?ref=${BASE_REF}" 2>"$err")"; then
            kind="$(printf '%s' "$meta" | jq -r 'if type == "array" then "directory" else .type end')"
            if [ "$kind" != "file" ]; then
              echo "'${GUIDELINES}' on ${BASE_REF} is a ${kind}, not a file; refusing" >&2
              echo "to review under a contract path that does not name one." >&2
              exit 1
            fi
            # `// 0` and `// ""`, because jq -r prints the STRING "null" for a
            # missing field and both branches below then misread it: bash
            # errors on `[ "null" -eq 0 ]`, and "null" is non-empty so the
            # withheld-content branch never fires -- leaving base64 to decode
            # the word null. Verified both ways. The coercion is inert on real
            # responses: jq treats 0 and "" as truthy, so a genuine 0-byte file
            # and a genuine empty content still pass through as themselves.
            size="$(printf '%s' "$meta" | jq -r '.size // 0')"
            encoded="$(printf '%s' "$meta" | jq -r '.content // ""')"

            # An empty `.content` has two unrelated causes and they must not
            # share a branch. A 0-byte file is a real committed contract that
            # carries no rules: unhelpful, not broken, and failing the job for
            # it would break a repository for committing an empty file. A file
            # WITH bytes whose content came back empty is the API declining to
            # inline it past 1 MB, which would silently drop a real contract,
            # so that stays fatal. `.size` is what separates them.
            if [ "${size:-0}" -eq 0 ]; then
              echo "${GUIDELINES} on ${BASE_REF} is empty; using the general brief." >> "$GITHUB_STEP_SUMMARY"
            elif [ -z "$encoded" ]; then
              echo "Contract '${GUIDELINES}' on ${BASE_REF} is ${size} bytes but the" >&2
              echo "API returned no content (over the 1 MB inline limit); refusing." >&2
              exit 1
            else
              printf '%s' "$encoded" | base64 -d > "$dest"
              have_contract=true
              echo "Contract: ${GUIDELINES} as of ${BASE_REF}." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif grep -q 'HTTP 404' "$err"; then
            # Absent on base. The one legitimate fallback: distinguishing it
            # from a 403, a rate limit or any 5xx is the whole point of
            # capturing stderr rather than discarding it.
            echo "No ${GUIDELINES} on ${BASE_REF}; using the general brief." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not read '${GUIDELINES}' on ${BASE_REF}. This is NOT a" >&2
            echo "missing file, so it is not the general-brief fallback:" >&2
            sed 's/^/    /' "$err" >&2
            exit 1
          fi
          rm -f "$err"

          if [ "$have_contract" = true ]; then
            echo "contract=${dest}" >> "$GITHUB_OUTPUT"
            # Carried INLINE into the prompt, never by path: Claude Code grants
            # file access to its working directory, and this file sits outside
            # the checkout so it cannot join the diff under review -- which also
            # put it out of the model's reach. Passing the bytes removes the
            # question. Random per-run delimiter, because a fixed one needed a
            # collision guard whose fallback emitted an empty body, which the
            # prompt reads as a hard stop.
            delim="CROSSROADS_CONTRACT_EOF_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
            {
              echo "contract_body<<${delim}"
              printf '%s\n' "$(cat "$dest")"
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "contract=" >> "$GITHUB_OUTPUT"
            echo "contract_body=" >> "$GITHUB_OUTPUT"
          fi

          # A pull request editing the contract is reviewed under the base
          # version AND told that it is doing so, because a change to the rules
          # is itself a change worth reviewing. Runs on every path above.
          #
          # Captured first, then tested. Writing this as
          # `if gh api ... | grep -q; then` puts the API call inside a
          # condition, where `set -e` deliberately does not abort -- so a 403,
          # a rate limit or any 5xx reads as "the contract was not modified",
          # and the reviewer is never told the rules it is applying are the
          # thing under change. That is the third place in this file where an
          # error path collapsed into an expected-outcome path; the other two
          # were the workflow listing and the contract read.
          #
          # `--jq` per page is correct HERE, unlike the counting steps: this
          # streams filenames, and the pages concatenate. It is aggregates like
          # `| length` that break, by emitting one result per page.
          if ! changed_files="$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
              --jq '.[].filename')"; then
            echo "Could not list this pull request's changed files, so whether the" >&2
            echo "contract is under change is unknown; refusing to guess." >&2
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep -qxF "${GUIDELINES}"; then
            echo "contract_changed=true" >> "$GITHUB_OUTPUT"
            echo "NOTE: this pull request modifies the contract itself." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "contract_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark the time before the model runs
        id: stamp
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' && steps.codex.outputs.reviewed != 'true'
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Claude review
        id: review
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' && steps.codex.outputs.reviewed != 'true'
        # Bounded HERE rather than only by `job-timeout-minutes`, because the two
        # failures are not equivalent. A job timeout CANCELS the job, which makes
        # `cancelled()` true and skips `Report review outcome` entirely -- the
        # step built to name the cause never runs, and the job dies with no
        # summary at all. A step timeout fails only this step, so the reporting
        # step still runs and the "did not finish" branch names it.
        #
        # MEASURED, not assumed: whether a step timeout leaves `cancelled()`
        # false is a documented ambiguity, and the whole reason for moving the
        # bound here rests on it. A probe job (crossroads-ci run 33661371506,
        # `timeout-minutes: 1` over a `sleep 180`) recorded the step timing out
        # with outcome AND conclusion `failure`, and the following
        # `if: !cancelled()` step running normally. So the premise holds, and a
        # step timeout arrives as `failure` rather than `cancelled`.
        #
        # The default sits between the two bounds it has to respect. Above
        # turn exhaustion: 120 turns at the measured ~6 turns/min is about 20
        # minutes, so the budget still binds first and `error_max_turns` stays
        # the ordinary diagnosis. Below the job ceiling: the worst legal
        # `codex-wait-seconds` is 10 minutes, and everything else before the
        # reviewer -- change detection, head-SHA dedup, checkout at
        # fetch-depth 0, contract resolution -- was MEASURED at 5-9s on
        # crossroads-ci and 8-12s on crossroads-ui, the larger consumer, over
        # three runs each. So the worst case is about 10 + 30 + 0.2 = 40.2
        # minutes against the 45-minute default of `job-timeout-minutes`. That
        # arithmetic is worked at the default deliberately: it is a measurement
        # of one configuration, not a claim that holds for every override, and
        # the pre-flight check is what actually enforces the relationship.
        #
        # The steps AFTER the reviewer sit inside the same job timeout and
        # were measured too, since an accounting that stops at the reviewer
        # would protect the wrong interval: confirmation and reporting took 2s
        # and 0s across three runs, on this pull request at 48 artefacts (8
        # comments, 20 inline, 20 reviews) -- the volume its three paginated
        # queries actually walk. Total non-review cost is therefore ~12s, and
        # the worst case stands at about 40.2 minutes.
        #
        # That margin is roughly 5 minutes and it is an assumption, not a
        # guarantee. Dedup paginates every workflow run for the head SHA,
        # checkout scales with history, and the confirmation queries scale with
        # comment volume. What would break it is any of those costing minutes
        # rather than seconds; re-measure before raising this default or the
        # Codex wait.
        timeout-minutes: ${{ inputs.review-timeout-minutes }}
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          # This is AGENT mode: `prompt:` is set and track_progress defaults to
          # false. In agent mode nothing is granted implicitly -- a prompt can
          # ask for twenty inline comments and the model will have no tool able
          # to leave one, finish successfully, and produce an empty pull
          # request. That is precisely the outcome the retirement recorded as
          # "zero reviews produced", and no amount of prompt wording fixes it.
          #
          # `use_sticky_comment` is deliberately NOT set: it is a known no-op in
          # agent mode (anthropics/claude-code-action#1108), and leaving it on
          # would imply a delivery path that does not exist.
          #
          # No --add-dir: the contract is inlined into the prompt, so nothing
          # reads it from disk and the grant only widened the readable surface.
          claude_args: |
            --model sonnet
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            the repository ${{ github.repository }}.

            You have been granted tools that can leave inline comments and pull
            request comments. Use them: findings that exist only in your final
            message never reach the pull request and are lost.

            ${{ steps.contract.outputs.contract && 'The review contract is reproduced between the markers below. It was read from the BASE branch, not from this pull request, so it is the contract as it stands on the target branch regardless of what this diff does to it. Follow it exactly, including any comment-only rule and any instruction to inspect source-of-truth files before judging a change.' || 'The base branch ships no review contract, so the markers below are empty. Review for correctness, security, and consistency with the surrounding code.' }}

            --- BEGIN REVIEW CONTRACT (from the base branch) ---
            ${{ steps.contract.outputs.contract_body }}
            --- END REVIEW CONTRACT ---

            ${{ (steps.contract.outputs.contract_changed == 'true' && steps.contract.outputs.contract) && 'This pull request MODIFIES the review contract. You are deliberately reviewing it under the base version above. Treat the change to the contract as a change under review: say plainly what it would loosen or tighten.' || '' }}

            ${{ (steps.contract.outputs.contract_changed == 'true' && !steps.contract.outputs.contract) && 'This pull request ADDS a review contract where the base branch has none. There is no base version to apply, so review the code under the general brief above, and judge the proposed contract itself on its merits.' || '' }}

            You are running inside the checkout, so open the files you need
            rather than inferring from the diff.

            If the contract markers above are empty while the text says a
            contract IS reproduced between them, stop and say so instead of
            reviewing. A review conducted without the contract it claims to
            apply is the failure this workflow exists to prevent. Empty markers
            are expected, and fine, when the text says the base branch ships
            none.

            Report only actionable findings supported by changed lines,
            highest severity first, capped at 20 inline comments. Skip style
            nits. Do not approve or request changes through the review API.

            Whatever you find, ALWAYS finish by posting exactly one summary
            comment on the pull request with `gh pr comment`: a short verdict
            naming what you inspected and either the findings, by severity, or
            the explicit statement that you found no actionable issues. This
            job verifies that a comment reached the pull request and FAILS on
            silence, because a reviewer that finds nothing and says nothing is
            indistinguishable from a reviewer that could not post at all. A
            clean diff is a result worth posting.

      # A conclusion of `success` says the action finished, NOT that a review
      # reached the pull request. Whether agent-mode Claude is handed tools that
      # can comment is a property of the action version and the consumer's
      # wiring, and it cannot be settled by reading this file -- which is
      # exactly how the retired workflow spent a month reporting green while
      # posting nothing. So the claim is checked rather than assumed: if
      # nothing appeared, the job goes red and the SHA is NOT recorded, so the
      # next push retries instead of inheriting a false "already reviewed".
      - name: Confirm a review actually reached the pull request
        id: posted
        # Gated on the step's own outcome, not on its `conclusion` output. The
        # output has been observed empty on a step that SUCCEEDED and whose
        # reviewer had posted comments (crossroads-ui#214). Gating the evidence
        # check on it meant the one check able to vindicate that run was the
        # one skipped, and the job then failed for the missing output while the
        # review sat on the pull request. Counting artefacts is the stronger
        # signal anyway: it reads what reached the PR rather than what the
        # action said about itself.
        if: >-
          steps.changes.outputs.reviewable == 'true' &&
          steps.dedup.outputs.skip == 'false' &&
          steps.codex.outputs.reviewed != 'true' &&
          steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.stamp.outputs.started }}
          EDITS_INVOKING_WORKFLOW: ${{ steps.entry.outputs.edits-invoking-workflow }}
        run: |
          set -euo pipefail
          # The timestamp is interpolated into the filter, NOT passed with
          # --arg: `gh api` has no --arg, and the earlier form failed at
          # runtime with "accepts 1 arg(s), received 4" -- which would have
          # made this step, and so the whole job, red on every single run
          # while never recording a SHA. Neither actionlint, shellcheck nor
          # zizmor can see a CLI misuse; only running it does. $SINCE comes
          # from `date -u` two steps up, so there is nothing to inject.
          #
          # Bot accounts only. Matching the login alone let any HUMAN whose
          # username contains "claude" satisfy this check by commenting after
          # the job started -- recording the SHA as reviewed and suppressing
          # every later review of it. A guard that is itself spoofable is
          # worse than none, because it reads as covered.
          # --slurp piped to jq for the same reason as the dedup step: under
          # --paginate, --jq runs per page, so `| length` returns one integer
          # per page and `$((comments + reviews))` fails the moment a pull
          # request passes 100 comments. `.[][]` flattens the page array.
          comments="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --slurp \
            | jq "[.[][] | select(.user.type == \"Bot\" and (.user.login | test(\"claude\"; \"i\")) and (.updated_at >= \"${SINCE}\"))] | length")"
          reviews="$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate --slurp \
            | jq "[.[][] | select(.user.type == \"Bot\" and (.user.login | test(\"claude\"; \"i\")) and (.submitted_at >= \"${SINCE}\"))] | length")"
          # INLINE review comments live at /pulls/{n}/comments -- a different
          # endpoint from both of the above. The tool this workflow now grants,
          # mcp__github_inline_comment__create_inline_comment, posts here, and
          # the prompt asks for up to twenty of them. Omitting this query meant
          # the likeliest success path counted as "posted nothing": the job
          # would fail on every run, never record a success, and so never
          # dedup -- the granted tool working perfectly and the guard calling
          # it a failure.
          inline="$(gh api "repos/${REPO}/pulls/${PR}/comments" --paginate --slurp \
            | jq "[.[][] | select(.user.type == \"Bot\" and (.user.login | test(\"claude\"; \"i\")) and (.updated_at >= \"${SINCE}\"))] | length")"
          total=$((comments + reviews + inline))
          if [ "$total" -eq 0 ] && [ "${EDITS_INVOKING_WORKFLOW:-false}" = "true" ]; then
            # The reviewer never ran, so there is nothing to diagnose about it.
            {
              echo "### Claude review could not run"
              echo
              echo "This pull request edits the workflow that invokes the reviewer,"
              echo "and the action refuses to run when that file differs from the"
              echo "copy on the default branch. It skipped itself and posted"
              echo "nothing; the review step's log ends in \"Exiting due to"
              echo "workflow validation skip\"."
              echo
              echo "Nothing here is fixable in this pull request, and the diff is"
              echo "not the problem. **This PR is UNREVIEWED and needs a human**"
              echo "review, which is why this job is red rather than skipped:"
              echo "changes to CI are the ones least safe to wave through."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer refused to run because this PR edits the invoking workflow; this PR is unreviewed and needs a human review." >&2
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            {
              echo "### Claude review posted nothing"
              echo
              echo "The action reported success but no Claude-authored comment or"
              echo "review appeared on this pull request. Treat this PR as UNREVIEWED."
              echo "Most likely the reviewer has no tool able to comment; check the"
              echo "action's tool configuration for this version."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer reported success but posted nothing; treating as unreviewed." >&2
            exit 1
          fi
          # A PR-LEVEL verdict, not merely "something was posted". The prompt
          # ends "ALWAYS finish by posting exactly one summary comment", so that
          # comment is the reviewer's own last action and its presence is the
          # closest thing this job has to proof the review ran to completion.
          #
          # Counting any artefact was too weak: it rests entirely on truncation
          # always surfacing as outcome=failure, which is claude-code-action's
          # internal exit-code behaviour and not something this workflow can
          # enforce. A run cut off after posting a few inline findings but
          # before its summary would have exited 0, counted those findings as
          # evidence, and been recorded as reviewed -- the truncated review
          # passing that this guard exists to prevent.
          #
          # Inline comments alone are therefore not enough. Reviews count
          # alongside comments because the verdict is PR-level either way; in
          # agent mode only `gh pr comment` is granted, so today this is the
          # comments query, and a future version granting a review tool stays
          # covered.
          verdict=$((comments + reviews))
          if [ "$verdict" -eq 0 ]; then
            {
              echo "### Claude review did not finish"
              echo
              echo "${inline} inline comment(s) reached this PR, but the summary"
              echo "comment the prompt always ends with never arrived, so the"
              echo "reviewer stopped before its last step and what it posted is"
              echo "partial. Treat this PR as UNREVIEWED."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer posted ${inline} inline comment(s) but no summary verdict; treating as unreviewed." >&2
            exit 1
          fi
          echo "Review reached the pull request (${total} artefact(s): ${comments} comment(s), ${reviews} review(s), ${inline} inline)." >> "$GITHUB_STEP_SUMMARY"

      # An early exit with no conclusion and no stated reason fails, so green
      # means reviewed. The retired workflow reported green while reviewing
      # nothing for a month; silence is the failure mode to catch.
      - name: Report review outcome
        if: ${{ !cancelled() && steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' && steps.codex.outputs.reviewed != 'true' }}
        env:
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          POSTED: ${{ steps.posted.outcome }}
          # Interpolated, never retyped: a diagnostic that misdescribes its own
          # trigger costs more than the failure it reports, and `max-turns` was
          # retuned twice in this PR alone.
          REVIEW_TIMEOUT: ${{ inputs.review-timeout-minutes }}
        run: |
          set -euo pipefail
          # An empty conclusion on a step that succeeded is not evidence of a
          # missing review -- crossroads-ui#214 had one, with the reviewer's
          # comments sitting on the pull request. Where the artefact count
          # already confirmed a review reached the PR, that is the stronger
          # signal and it stands on its own; the conclusion output is a claim
          # the action makes about itself.
          if [ -z "$CONCLUSION" ] && [ "$REVIEW_OUTCOME" = "success" ] && [ "$POSTED" = "success" ]; then
            echo "Reviewer emitted no conclusion, but a review reached the pull request; treating as reviewed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The evidence check already wrote the specific reason it failed --
          # nothing posted at all, or inline findings with no summary verdict --
          # so this step points at that message instead of composing a second
          # one. Restating it generically put two contradicting paragraphs in
          # the same run summary: "left no comment, review or inline comment"
          # printed directly beneath "N inline comment(s) reached this PR".
          #
          # Deferring also covers a non-empty conclusion. `posted` failing while
          # the action reports `success` used to match no branch at all and fall
          # through to "Claude review ran", asserting a clean outcome beside the
          # real failure. A review with no verdict is unreviewed whatever the
          # action says about itself.
          #
          # `posted` shares this step's own `if:` conditions and additionally
          # requires the review step to have succeeded, so whenever this step
          # runs after a successful review, `posted` ran too: it is success or
          # failure here, never skipped.
          # Ordered ahead of the evidence deference below, because a reported
          # failure is the more specific fact. `posted` only runs when the STEP
          # succeeded, but the action's conclusion can independently be
          # `failure` -- that split is why this file tracks the two separately
          # -- and a reviewer that errored out usually posted nothing, so the
          # evidence check fails too. Deferring first sent the reader to
          # `posted`'s "most likely the reviewer has no tool able to comment",
          # a plausible-but-wrong lead when the real cause was a reported
          # failure such as error_max_turns.
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "success" ]; then
            {
              echo "### Claude review reported a failure"
              echo
              echo "The reviewer finished with conclusion \`${CONCLUSION}\`. Open the"
              echo "**Claude review** step's log for the reason; if it also posted"
              echo "nothing, that is a consequence, not the cause."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "The reviewer reported a failure (conclusion: ${CONCLUSION}); treat this PR as unreviewed." >&2
            exit 1
          fi
          if [ "$POSTED" = "failure" ]; then
            echo "Review evidence check failed; see 'Confirm a review actually reached the pull request' above. Treat this PR as unreviewed." >&2
            exit 1
          fi
          # An empty conclusion has several causes that need different actions,
          # and naming the wrong one costs an investigation. This step runs
          # under !cancelled(), so it is reached even when the reviewer never
          # started -- `steps.review.outcome` is what separates the cases.
          #
          # Each outcome is matched by NAME, and anything unrecognised falls to
          # the catch-all rather than borrowing a neighbour's diagnosis. An
          # earlier draft made this branch the default ("not success and not
          # failure"), which would have swallowed `cancelled` and told the
          # reader nothing ran when in fact the review had.
          if [ -z "$CONCLUSION" ] && [ "$REVIEW_OUTCOME" = "skipped" ]; then
            # Skipped: an earlier step in this job failed, so the reviewer was
            # never invoked. Nothing was reviewed and no turn budget was spent.
            #
            # The cause is named generically on purpose. An earlier draft said
            # "checkout or contract resolution", which is not exhaustive: `Wait
            # for Codex review` runs before Checkout and carries no `if:`, so
            # its failure skips the reviewer with this same signature while
            # leaving `steps.codex.outputs.reviewed` unset, which keeps this
            # step running. Enumerating steps here would point the reader at
            # the wrong one -- the misdiagnosis this whole change removes.
            {
              echo "### Claude review never started"
              echo
              echo "The reviewer step was \`${REVIEW_OUTCOME}\`, so an earlier step in"
              echo "this job failed and the reviewer was never invoked. Find the red"
              echo "step above and fix that; the turn budget is not involved here,"
              echo "and nothing was reviewed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer never started (step ${REVIEW_OUTCOME}); fix the earlier red step in this job. Treat this PR as unreviewed." >&2
            exit 1
          fi
          # `cancelled` belongs here, not with the never-started case. The
          # probe cited on the review step measured a step timeout arriving as
          # `failure`, so this is not the timeout path in practice -- but a
          # cancelled review step we are still here to report on was stopped
          # individually either way, since a JOB cancellation would make
          # `cancelled()` true and skip this step altogether. Both values mean
          # the reviewer started and was cut off, so both take this branch and
          # the routing survives the runner changing its mind.
          if [ -z "$CONCLUSION" ] \
            && { [ "$REVIEW_OUTCOME" = "failure" ] || [ "$REVIEW_OUTCOME" = "cancelled" ]; }; then
            # Ran and died mid-review. Saying "produced no conclusion" sent
            # three separate investigations looking for a broken output capture
            # when the cause was error_max_turns each time, with findings
            # already posted on the PR.
            #
            # Two bounds now produce this signature, and they need opposite
            # responses: the turn budget, and the step's own `timeout-minutes`
            # added by this change. Both surface as outcome=failure with no
            # conclusion, so the message asks the reader which one the log
            # shows rather than asserting either. Raising `max-turns` for a
            # wall-clock timeout would be the same misdiagnosis one bound over.
            {
              echo "### Claude review did not finish"
              echo
              echo "The reviewer step failed before reporting a conclusion, so this"
              echo "PR is only partly reviewed and anything it posted is incomplete."
              echo "Both bounds end the step the same way, so its outcome does not"
              echo "tell them apart. The **Claude review** log line does:"
              echo
              echo "- \`error_max_turns\` — the turn budget ran out mid-review."
              echo "  Raise \`max-turns\`."
              echo "- \`has timed out after ${REVIEW_TIMEOUT} minutes\` — the step's"
              echo "  \`timeout-minutes\`, which is wall-clock. Raising \`max-turns\` will"
              echo "  not help; the review is running slower per turn than the budget"
              echo "  assumes."
              echo
              echo "Those two are the bounds this workflow sets, not the only ways to"
              echo "get here: any unhandled error in the action — a crash, an auth"
              echo "failure, an OOM — ends the step the same way. If the log shows"
              echo "neither bound, read it for the actual error rather than retuning"
              echo "either budget."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer step did not finish (no conclusion); see the Claude review step. Treat this PR as unreviewed." >&2
            exit 1
          fi
          if [ -z "$CONCLUSION" ]; then
            # Unrecognised outcome. Report the value and assert no cause: a
            # guess here is the misdiagnosis this whole step exists to avoid.
            {
              echo "### Claude review outcome not recognised"
              echo
              echo "The reviewer step reported \`${REVIEW_OUTCOME}\` with no conclusion,"
              echo "which this check has no diagnosis for. Read the **Claude review**"
              echo "step's log directly. Treat this PR as UNREVIEWED."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewer outcome '${REVIEW_OUTCOME}' with no conclusion is unrecognised; treat this PR as unreviewed." >&2
            exit 1
          fi
          # Every other value was handled above, so reaching here means
          # conclusion=success with the evidence check satisfied.
          echo "Claude review ran (conclusion: ${CONCLUSION})." >> "$GITHUB_STEP_SUMMARY"
