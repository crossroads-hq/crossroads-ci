# Reusable: Claude review for a pull request, deduplicated by head SHA.
#
# The fleet's old deduplication was `action != 'synchronize'` at the job
# level: one review per PR, but the state that actually MERGES -- after
# further commits and the strict-checks sync with main -- was never reviewed.
# This workflow allows `synchronize` and instead skips only when the head SHA
# has already been reviewed, recorded in a marker comment on the PR. New
# commits get reviewed; re-deliveries of the same state do not.
#
# ubuntu-latest, so callable today only from public repositories -- a private
# caller's job will not start while the account's Actions billing is
# unresolved. The caller passes its own CLAUDE_CODE_OAUTH_TOKEN.
#
# NOT a required check by design: a reviewer that can block a merge is a
# reviewer that gets worked around. The gate should not list this job.
name: AI review

on:
  workflow_call:
    inputs:
      guidelines-file:
        description: Repo-relative path to the review contract.
        type: string
        required: false
        default: .github/review-guidelines.md
      max-turns:
        description: Claude Code turn budget for one review.
        type: string
        required: false
        default: "25"
    secrets:
      claude-code-oauth-token:
        description: The caller's CLAUDE_CODE_OAUTH_TOKEN.
        required: true

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # The caller is expected to gate on its own conditions (draft, fork,
    # [skip-ai-review]); this workflow enforces the ones it can see itself.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.title, '[skip-ai-review]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # The action exchanges the workflow's OIDC token for a Claude App token
      # so comments are attributed to claude[bot]. Safe under the fork guard
      # above.
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Detect reviewable changes
        id: changes
        uses: tsviser/crossroads-ci/actions/detect-reviewable@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One review per head SHA. The marker comment survives pushes, so a
      # `synchronize` for a new commit reviews it, while re-deliveries of an
      # already-reviewed state (reopen, ready_for_review after no change)
      # skip the model entirely.
      - name: Check whether this head SHA was already reviewed
        id: dedup
        if: steps.changes.outputs.reviewable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reviewed="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[].body' \
            | sed -n 's/.*<!-- crossroads-ai-review:reviewed-sha=\([0-9a-f]*\) -->.*/\1/p' \
            | tail -n 1)"
          if [ "$reviewed" = "$HEAD_SHA" ]; then
            echo "Head ${HEAD_SHA} already reviewed; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude review
        id: review
        if: steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false'
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          use_sticky_comment: true
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
          prompt: |
            Review this pull request against ${{ inputs.guidelines-file }}.
            That file is the contract. Follow it exactly, including the
            comment-only rule and the instruction to inspect the
            source-of-truth files it names before judging a change.

            You are running inside the checkout, so open those files rather
            than inferring from the diff.

            Report only actionable findings supported by changed lines,
            highest severity first, capped at 20 inline comments. Skip style
            nits. Do not approve or request changes through the review API.

      # The marker lands only after the action reports a conclusion, so a
      # crashed or silently-skipped review does not mark the SHA as done --
      # the next delivery retries it.
      - name: Record reviewed SHA
        if: >-
          steps.changes.outputs.reviewable == 'true' &&
          steps.dedup.outputs.skip == 'false' &&
          steps.review.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body="<!-- crossroads-ai-review:reviewed-sha=${HEAD_SHA} -->
          Claude reviewed \`${HEAD_SHA}\`."
          marker_id="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | contains("crossroads-ai-review:reviewed-sha=")) | .id' \
            | tail -n 1)"
          if [ -n "$marker_id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${marker_id}" -f body="$body" --silent
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" --silent
          fi

      # Same contract as crossroads-ui's local job: an early exit with no
      # conclusion and no stated reason fails, so green means reviewed.
      - name: Report review outcome
        if: ${{ !cancelled() && steps.changes.outputs.reviewable == 'true' && steps.dedup.outputs.skip == 'false' }}
        env:
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [ -n "$CONCLUSION" ]; then
            echo "Claude review ran (conclusion: $CONCLUSION)." >> "$GITHUB_STEP_SUMMARY"
            if [ "$CONCLUSION" = "success" ]; then exit 0; fi
            echo "The reviewer reported a failure; treat this PR as unreviewed." >&2
            exit 1
          fi
          echo "Claude review produced no conclusion and no stated reason; this PR is unreviewed." >&2
          exit 1
