# Weekly inverse of the retired verify-fleet.sh: not "does each repository carry the right
# ruleset" -- org rulesets make that unaskable -- but "is anything ESCAPING
# inheritance?"
#
# Runs on ubuntu-latest, deliberately. An audit that cannot run while the
# self-hosted fleet is down is unavailable exactly when it matters: on
# 2026-09-03 the WSL box took every lane offline for three hours, and a
# fleet-hosted audit would have been silent throughout. This also keeps `gh`
# and `jq` guaranteed rather than assumed -- the assumption that broke the
# production deploy the same day.
name: Fleet drift audit

on:
  schedule:
    # Mondays 07:00 UTC. Weekly, not nightly: the findings are structural and
    # a daily red mail gets filtered, which is how an audit stops being read.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: fleet-drift-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Fleet drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # FLEET_AUDIT_TOKEN is required; there is no GITHUB_TOKEN fallback.
      # That fallback was meant to degrade to "a few checks skipped". What it
      # did was worse: GITHUB_TOKEN is scoped to this repository, so the org
      # listing returned only the public repositories, and every private one
      # was reported as a MUST FIX "no such repository" -- along with merge
      # settings the token could not read, reported as "unset". Every
      # scheduled run from 2026-09-07 to 2026-10-05 failed on those findings
      # alone (8 private repositories, 3 of 11 audited), while the same
      # script run with an owner token found no drift. A red run that is
      # always red for the wrong reason is how an audit stops being read.
      # README "Fleet drift audit" lists the token's permissions.
      - name: Check the audit token is configured
        env:
          # Presence only; the value never reaches this step.
          HAS_AUDIT_TOKEN: ${{ secrets.FLEET_AUDIT_TOKEN != '' }}
        run: |
          if [ "$HAS_AUDIT_TOKEN" != "true" ]; then
            {
              echo "### Fleet drift audit did not run"
              echo
              echo "The \`FLEET_AUDIT_TOKEN\` secret is not set, and no other token"
              echo "can see the fleet's private repositories. See README,"
              echo "\"Fleet drift audit\", for the permissions it needs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::FLEET_AUDIT_TOKEN is not set; the audit cannot see the private fleet repositories."
            exit 1
          fi

      - name: Audit
        env:
          GH_TOKEN: ${{ secrets.FLEET_AUDIT_TOKEN }}
          FLEET_ORG: ${{ github.repository_owner }}
        run: bash scripts/audit-fleet-drift.sh
