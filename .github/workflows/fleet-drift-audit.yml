# Weekly inverse of the retired verify-fleet.sh: not "does each repository carry the right
# ruleset" -- org rulesets make that unaskable -- but "is anything ESCAPING
# inheritance?"
#
# Runs on ubuntu-latest, deliberately. An audit that cannot run while the
# self-hosted fleet is down is unavailable exactly when it matters: on
# 2026-09-03 the WSL box took every lane offline for three hours, and a
# fleet-hosted audit would have been silent throughout. This also keeps `gh`
# and `jq` guaranteed rather than assumed -- the assumption that broke the
# production deploy the same day.
name: Fleet drift audit

on:
  schedule:
    # Mondays 07:00 UTC. Weekly, not nightly: the findings are structural and
    # a daily red mail gets filtered, which is how an audit stops being read.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: fleet-drift-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Fleet drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The audit reads as a GitHub App, not a personal token (crossroads-os
      # ADR-0005 rule 4), and there is no GITHUB_TOKEN fallback. That fallback
      # was meant to degrade to "a few checks skipped". What it did was worse:
      # GITHUB_TOKEN is scoped to this repository, so the org listing returned
      # only the public repositories, and every private one was reported as a
      # MUST FIX "no such repository" -- along with merge settings the token
      # could not read, reported as "unset". Every scheduled run from
      # 2026-09-07 to 2026-10-05 failed on those findings alone (8 private
      # repositories, 3 of 11 audited), while the same script run with an
      # owner token found no drift. A run that is always red for the wrong
      # reason is how an audit stops being read.
      #
      # Both secrets are delivered by Infisical (project crossroads-ci,
      # Production, /ci, sync ci-ci-prod). README "Fleet drift audit" records
      # the App's permissions.
      - name: Check the audit App credentials are configured
        env:
          # Presence only; the values never reach this step.
          CLIENT_ID_SET: ${{ secrets.FLEET_AUDIT_APP_CLIENT_ID != '' }}
          KEY_SET: ${{ secrets.FLEET_AUDIT_APP_PRIVATE_KEY != '' }}
        run: |
          missing=""
          [ "$CLIENT_ID_SET" = "true" ] || missing="$missing FLEET_AUDIT_APP_CLIENT_ID"
          [ "$KEY_SET" = "true" ] || missing="$missing FLEET_AUDIT_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            {
              echo "### Fleet drift audit did not run"
              echo
              echo "Missing Actions secret(s):${missing}. They belong to the read-only"
              echo "fleet-audit GitHub App and are delivered by Infisical sync"
              echo "\`ci-ci-prod\`. No other token can see the fleet's private"
              echo "repositories. See README, \"Fleet drift audit\"."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing Actions secret(s):${missing}. The audit cannot see the private fleet repositories without the fleet-audit App."
            exit 1
          fi

      # The same pin crossroads-agent-system uses. No `repositories`, so the
      # token covers every repository the App is installed on -- all of them,
      # which the classification check needs to find a repository nobody
      # listed. Every permission is read, the App holds nothing more, and the
      # token is revoked when the job ends. No Administration: the merge
      # settings are read over GraphQL, which needs no more than read access
      # (scripts/audit-fleet-drift.sh, Merge settings).
      - name: Mint a read-only token for the audit
        id: audit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.FLEET_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read
          permission-secrets: read
          permission-organization-custom-properties: read
          permission-organization-secrets: read

      - name: Audit
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
          FLEET_ORG: ${{ github.repository_owner }}
        run: bash scripts/audit-fleet-drift.sh
