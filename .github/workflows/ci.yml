# The control plane validates itself with its own tools.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue entries. Without this trigger a queued PR waits for a
  # "PR Validation" check that never starts and times out of the queue.
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Job-level filters, not workflow-level paths-ignore: a docs-only PR
      # must still report PR Validation, with verify jobs skipped rather than
      # never scheduled. Same rationale as actions/detect-reviewable.
      # Skipped on merge_group: paths-filter has no diff base there, and this
      # job is a REQUIRED gate input -- a step failure would bounce every
      # queued PR. The outputs go unread on that event anyway: both consumers
      # below treat merge_group like push and run unconditionally.
      - name: Path filter
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow:
              - '.github/**'
            scripts:
              - 'scripts/**'
              - 'governance/**'
              - 'actions/**'

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      needs.changes.outputs.workflow == 'true'
    uses: ./.github/workflows/_workflow-lint.yml

  scripts:
    name: Scripts and profiles
    needs: changes
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax
        run: |
          set -euo pipefail
          n=0
          for f in scripts/*.sh; do bash -n "$f"; n=$((n + 1)); done
          echo "bash -n clean on ${n} scripts"

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Governance profiles parse and render
        run: |
          set -euo pipefail
          for f in governance/*.json; do jq empty "$f"; done
          # Every fleet entry must name a profile this repo actually ships,
          # and the renderer must produce valid JSON for its branch.
          while read -r repo profile branch _; do
            case "$repo" in ''|'#'*) continue ;; esac
            case "$profile" in
              full|full+tags) pf=governance/ruleset-full.json ;;
              minimal)        pf=governance/ruleset-minimal.json ;;
              *) echo "unknown profile '$profile' for $repo" >&2; exit 1 ;;
            esac
            jq --arg name "Crossroads ${branch} protection" \
               --arg ref "refs/heads/${branch}" \
               '.name = $name | .conditions.ref_name.include = [$ref]' \
               "$pf" | jq empty
          done < governance/repositories.txt
          echo "all fleet entries render"

      - name: Composite actions parse
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each { |f| YAML.safe_load(File.read(f)) }' actions/*/action.yml
          # One file per invocation. `node --check a.js b.js` parses only the
          # FIRST argument -- the rest land in process.argv -- so it exits 0
          # on a broken second file. A check that reports success having
          # verified almost nothing is the exact defect this workflow exists
          # to close, so it does not get to ship inside the fix.
          n=0
          for f in actions/*/*.js; do node --check "$f"; n=$((n + 1)); done
          echo "action.yml files parse; ${n} action scripts parse"

      # The merge gate for every repository in the fleet. It shipped untested
      # -- and unparsed -- until now; a typo here reaches all of them at once.
      - name: Action logic tests
        run: node --test actions/*/*.test.js

  supply-chain:
    name: Supply chain
    # UNCONDITIONAL, and not in the gate's allow-skipped below. This job was
    # path-filtered for speed; the filter did not match a root-level file, so a
    # PR touching only README.md skipped the whole workflow -- including the
    # gitleaks scan. A pasted credential in documentation is the ordinary case,
    # not the exotic one, and the scan's own rationale ("a secret committed
    # then reverted is still leaked") applies to every diff or none. The legs
    # that genuinely depend on changed paths -- osv-scan, npm-audit -- are off
    # by input below, so skipping the rest bought a few seconds on docs-only
    # pull requests and nothing else.
    uses: ./.github/workflows/_supply-chain.yml
    # A called workflow's jobs may not exceed the CALLER's grant, and the
    # secret-scan job inside now needs pull-requests: read -- omitting it
    # here fails the whole workflow at startup, before any job exists.
    permissions:
      contents: read
      pull-requests: read
    # No package.json or lockfiles here; osv-scan and npm-audit stay off.
    with:
      npm-audit: false
      osv-scan: false

  # The first consumer of the rebuilt reviewer. The workflow merged in #19
  # with zero callers, so it had never run; a reusable workflow with no
  # caller reviews nothing, which is the exact silence its header warns
  # about. Local `uses:`, like _supply-chain.yml above: the SHA-pinning rule
  # in the README is for OTHER repositories, where the pin stops this repo
  # moving the ref under them -- meaningless for the repo the file lives in.
  # Deliberately absent from the gate's needs: the reviewer advises, the
  # gate blocks, and _ai-review.yml's header records why those stay apart.
  ai-review:
    name: AI review
    uses: ./.github/workflows/_ai-review.yml
    # A called workflow's jobs may not exceed the caller's grant (same rule
    # as supply-chain above); id-token is never inherited, so omitting this
    # block fails the run at startup.
    permissions:
      contents: read
      pull-requests: write
      actions: read         # head-SHA dedup reads /actions/runs and its jobs
      id-token: write
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  gate:
    name: PR Validation
    # The fleet convention, applied to the fleet's own control plane: one
    # aggregate check with this exact name, so governance/repositories.txt can
    # list this repository under the `full` profile like any other.
    if: ${{ !cancelled() }}
    needs: [changes, workflow-lint, scripts, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Local composite (`./actions/gate`): checkout required so action.yml
      # is on disk. Fleet callers use the remote pin and omit this step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required results
        uses: ./actions/gate
        with:
          allow-skipped: |
            Workflow lint
            Scripts
          # "Detect changes" is REQUIRED, deliberately absent from
          # allow-skipped: it carries no `if:`, so it never legitimately skips.
          # Omitting it entirely -- as this gate did until now -- was a hole.
          # A failed `changes` makes GitHub mark every job that needs it
          # `skipped`; each of those skips was excused here, so the gate
          # reported success having validated nothing. The rule this encodes:
          # whenever a job's skip is excused, the job that decides whether it
          # skips must itself be required.
          results: |
            {
              "Detect changes": "${{ needs.changes.result }}",
              "Workflow lint": "${{ needs.workflow-lint.result }}",
              "Scripts": "${{ needs.scripts.result }}",
              "Supply chain": "${{ needs.supply-chain.result }}"
            }
