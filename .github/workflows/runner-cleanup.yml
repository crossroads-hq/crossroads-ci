# Weekly: list, and when enabled remove, offline self-hosted runner
# registrations for the fleet. scripts/clean-runners.sh holds the rules and is
# dry-run unless APPLY=1. The disk side of runner cleanup is not here: a job
# lands on one arbitrary runner, so per-host work is a systemd timer on each
# host (runner-host/fleet-runner-clean.sh).
#
# Runs on ubuntu-latest, deliberately: it must work while the fleet is down.
#
# GitHub reports a runner as offline, never for how long, and a host that is
# merely down looks the same as a retired one. So the scheduled run only
# removes registrations when the repository variable RUNNER_CLEANUP_APPLY is
# "true"; until then it lists them in the job summary. A manual run removes
# only when its `apply` input is ticked.
name: Runner cleanup

on:
  schedule:
    # Sundays 06:30 UTC, after the branch cleanup and before the Monday audit.
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Remove offline runner registrations (otherwise only list them)
        type: boolean
        default: false

concurrency:
  group: runner-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean:
    name: Runner cleanup
    # A write-capable token: never from a branch other than the one that holds
    # the reviewed script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The App's credentials belong in this environment, whose deployment-branch
    # policy is `main` only, so a workflow run from any other branch is refused
    # them. The `if` above is not enough: a branch can edit its own copy of this
    # file and drop it. Until the environment holds both secrets, the
    # repository-level copies (Infisical sync ci-ci-prod) still resolve and the
    # key stays readable from any branch. The three maintenance Apps share one
    # environment, `branch-cleaner`, fed by one Infisical sync. README, "Keys of
    # the other three Apps".
    environment: branch-cleaner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A separate App from the branch cleaner: runner administration is a
      # much larger permission than deleting a branch, and should not ride on
      # the same key. Delivered by Infisical like the others.
      #
      # Neither secret set means the App has not been created yet: the run skips
      # with a notice rather than going red every Sunday. Exactly one set is a
      # half-finished setup, and that fails. Once RUNNER_CLEANUP_APPLY is "true", or a manual
      # run ticks apply, the App is expected to exist, so missing secrets then fail
      # too: a sync that empties them must not turn into weeks of green runs that
      # clean nothing.
      - name: Check the runner-cleaner App credentials are configured
        id: creds
        env:
          # Presence only; the values never reach this step.
          CLIENT_ID_SET: ${{ secrets.RUNNER_CLEANER_APP_CLIENT_ID != '' }}
          KEY_SET: ${{ secrets.RUNNER_CLEANER_APP_PRIVATE_KEY != '' }}
          # Deletion is expected: the variable is on, or a manual run ticked apply.
          APPLY_ENABLED: ${{ vars.RUNNER_CLEANUP_APPLY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: |
          if [ "$CLIENT_ID_SET" != "true" ] && [ "$KEY_SET" != "true" ] && [ "$APPLY_ENABLED" != "true" ]; then
            {
              echo "### Runner cleanup skipped"
              echo
              echo "The runner-cleaner GitHub App is not set up yet (no"
              echo "RUNNER_CLEANER_APP_* Actions secrets). Nothing was listed or"
              echo "removed. See README, \"Weekly cleanup\"."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Runner cleanup skipped: the runner-cleaner App is not set up yet."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ "$CLIENT_ID_SET" = "true" ] || missing="$missing RUNNER_CLEANER_APP_CLIENT_ID"
          [ "$KEY_SET" = "true" ] || missing="$missing RUNNER_CLEANER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            {
              echo "### Runner cleanup did not run"
              echo
              echo "Missing Actions secret(s):${missing}. The other half is set, so the"
              echo "setup is unfinished. See README, \"Weekly cleanup\"."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing Actions secret(s):${missing}. The runner-cleaner App is only half configured."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Mint a token for the cleanup
        id: cleaner-token
        if: steps.creds.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RUNNER_CLEANER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNNER_CLEANER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-organization-self-hosted-runners: write
          permission-metadata: read

      - name: Clean runner registrations
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.cleaner-token.outputs.token }}
          APPLY: ${{ ((github.event_name == 'schedule' && vars.RUNNER_CLEANUP_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply)) && '1' || '0' }}
        run: bash scripts/clean-runners.sh
